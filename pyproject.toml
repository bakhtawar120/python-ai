[project]
name = "python-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bakhtawar120", email = "bkdoll199@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.3",
]

[project.scripts]
python-ai = "python_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv.workspace]
members = [
    "python-ai",
]
